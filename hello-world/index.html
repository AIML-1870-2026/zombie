<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
        }
        .content {
            transform: skew(-3deg);
            position: relative;
            padding: 2rem;
        }
        .content::before,
        .content::after {
            content: '';
            position: absolute;
            background: linear-gradient(90deg,
                transparent 0%,
                white 50%,
                transparent 100%);
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .content::before {
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            animation: moveTop 2s linear infinite;
        }
        .content::after {
            top: 0;
            right: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg,
                transparent 0%,
                white 50%,
                transparent 100%);
            animation: moveRight 2s linear infinite;
            animation-delay: 0.5s;
        }
        .moving-line {
            position: absolute;
            background: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .moving-line:nth-of-type(1) {
            bottom: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg,
                transparent 0%,
                white 50%,
                transparent 100%);
            animation: moveBottom 2s linear infinite;
            animation-delay: 1s;
        }
        .moving-line:nth-of-type(2) {
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg,
                transparent 0%,
                white 50%,
                transparent 100%);
            animation: moveLeft 2s linear infinite;
            animation-delay: 1.5s;
        }
        @keyframes moveTop {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }
        @keyframes moveRight {
            from { transform: translateY(-100%); }
            to { transform: translateY(100%); }
        }
        @keyframes moveBottom {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
        @keyframes moveLeft {
            from { transform: translateY(100%); }
            to { transform: translateY(-100%); }
        }
        h1 {
            color: white;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 0.5rem 0;
        }
        p {
            color: white;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="moving-line"></div>
        <div class="moving-line"></div>
        <h1>Noah Markworth</h1>
        <p>Hello, World! I am the one and only vibe.</p>
    </div>
</body>
</html>
